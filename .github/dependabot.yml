version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/workflows"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
      runtime:
        dependency-type: production
    commit-message:
      prefix: deps
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The builder must stay on the distroless runtime's Python minor (3.13);
      # move both together by hand when distroless ships a newer one.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: deps
